name: digital_business_card
description: "Phan he Thiet ke & Quan ly Danh thiep (Digital Business Card)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State Management & Local Storage
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  intl: ^0.19.0

  # Routing
  go_router: ^14.2.0

  # Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI, Fonts & Styling
  google_fonts: ^6.2.1
  flex_color_picker: ^3.6.0
  cached_network_image: ^3.3.1

  # Image Processing & Cropping
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.3.0

  # Firebase Cloud Services (Firestore & Storage)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Hardware: Camera, QR, NFC, GPS, Contacts, Biometric
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  nfc_manager: ^3.3.0
  flutter_contacts: ^1.1.9+2
  geolocator: ^13.0.1
  geocoding: ^5.0.0
  local_auth: ^2.2.0
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.1

  # Sharing & Utilities
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  screenshot: ^3.0.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
